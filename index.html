<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RosterMe</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#faf4ea">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<style>:root{--bg1:#faf4ea;--bg2:#f0e4d0;--card:#FFFBF4;--line:#E2D3BD;--tx:#3A2E25;--mt:#7A6A5A;--acc:#B0703A;--acc2:#7a5232;--hdA:#4A3628;--hdB:#8A6040;--hdC:#BC8048;--soft:#F3E3CC;--red:#B22030;--blue:#1A4596;--ok:#137A3A;--okbg:#DDF5E5;--wt:#9A6200;--wtbg:#FFF1D6;--bad:#B22030;--badbg:#FDECEA;--bl:#1A4596;--blbg:#E3ECFB;--shade:rgba(40,25,10,.55);--input:#FFFFFF;--font:Calibri,Carlito,"Noto Sans","Noto Sans Sinhala","Noto Sans Tamil","Segoe UI",system-ui,sans-serif;color-scheme:light}
body.th-light{--bg1:#F3F5F9;--bg2:#E9EDF5;--card:#FFFFFF;--line:#DDE3EE;--tx:#1B2333;--mt:#5F6B80;--acc:#1A4596;--acc2:#1A4596;--hdA:#0E1730;--hdB:#1E3A8A;--hdC:#3B6FD8;--soft:#E3ECFB}
body.th-green{--bg1:#EEF6F0;--bg2:#DCEFE2;--card:#FFFFFF;--line:#CFE3D6;--tx:#17301F;--mt:#5A7262;--acc:#137A3A;--acc2:#0F5E2D;--soft:#DDF0E3}
body.th-red{--bg1:#FBF0F0;--bg2:#F4DEDF;--card:#FFFFFF;--line:#EBCFD1;--tx:#3A1A1E;--mt:#7A5A5E;--acc:#B22030;--acc2:#8A1824;--soft:#F8E1E3}
body.th-teal{--bg1:#EBF6F6;--bg2:#D6ECEC;--card:#FFFFFF;--line:#C9E2E2;--tx:#12302F;--mt:#557271;--acc:#0F766E;--acc2:#0B5A54;--soft:#D7EEEC}
body.th-purple{--bg1:#F4F0FA;--bg2:#E6DDF4;--card:#FFFFFF;--line:#DCD1EE;--tx:#271A3A;--mt:#6A5D80;--acc:#6A3FB0;--acc2:#53318A;--soft:#E9E0F7}
body.th-blue{--bg1:#2c3f86;--bg2:#4a3a9a;--card:#34458A;--line:#4A5A9C;--tx:#F2F5FF;--mt:#C3CCEB;--acc:#9DB8FF;--acc2:#DCE5FF;--hdA:#1e2d64;--hdB:#3150b4;--hdC:#6d4ad8;--soft:#4A5A9C;--input:#2B3A78;--okbg:#1d4d39;--ok:#7BE3A6;--wtbg:#5a4a1d;--wt:#FFD37A;--badbg:#5a2534;--bad:#FF9A92;--blbg:#2b3f8a;--bl:#B9CBFF;color-scheme:dark}
body.th-dark{--bg1:#0F1622;--bg2:#141127;--card:#1A2333;--line:#2A3446;--tx:#E8EDF4;--mt:#9AA6B8;--acc:#7DA2FF;--acc2:#C7D2FE;--hdA:#0E1730;--hdB:#1E2D5A;--hdC:#3B3A7A;--soft:#2A3446;--input:#121a28;--okbg:#173A27;--ok:#5BD58A;--wtbg:#3A2E15;--wt:#F2B653;--badbg:#3A2224;--bad:#FF7A6E;--blbg:#1E2E4E;--bl:#8DB4FF;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(165deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font-family:var(--font);font-size:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
b,strong{font-weight:600}
.app{max-width:620px;margin:0 auto;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.hd{background:var(--bg1);color:var(--tx);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 18px;position:sticky;top:0;z-index:20}
.hdtop{display:flex;align-items:center;gap:8px}
.bb{display:inline-flex;align-items:center;gap:6px;background:#FFFBF4;border-radius:12px;padding:4px 10px 4px 6px;font-family:Inter,Calibri,Carlito,sans-serif;font-size:16px;letter-spacing:-.3px;border:1px solid var(--line)}
.bb b{color:#B22030;font-weight:700}.bb i{color:#1A4596;font-style:normal}
.hdtop .sp{flex:1}
.hbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;color:var(--tx)}
.hbtn svg{width:22px;height:22px}
.hbtn .dot{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:#B22030;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
.hrow .tt{min-width:0;flex:1}
.hd h1{margin:0;font-size:23px;line-height:1.15;font-weight:600}
.hd .s{font-size:14px;opacity:.9;margin-top:3px}
.hsel{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--tx);max-width:100%}
.hsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newb{background:var(--acc);color:#fff;font-weight:600;font-size:15px;padding:9px 14px;border-radius:20px;white-space:nowrap;box-shadow:0 4px 12px #0000002e}
.back{font-size:26px;color:var(--tx);padding:0 8px 0 0;line-height:1}
.bd{padding:12px max(14px,env(safe-area-inset-left,0px)) 10px}
.sec{font-size:12.5px;font-weight:600;color:var(--acc2);letter-spacing:.8px;text-transform:uppercase;margin:16px 2px 8px;display:flex;align-items:center;gap:7px}
.sec:before{content:"";width:6px;height:6px;border-radius:2px;background:linear-gradient(135deg,#B22030,#1A4596)}
.sec .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:14px;color:var(--acc)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border-radius:14px;padding:10px 12px;color:#fff;background:linear-gradient(135deg,#c9965f,#9a6a3a);text-align:left;display:block;width:100%}
.k .n{font-size:24px;font-weight:600}.k .l{font-size:13px;font-weight:600;opacity:.95}
.k.r{background:linear-gradient(135deg,#d9473b,#b22030)}.k.b{background:linear-gradient(135deg,#3b82f6,#1a4596)}.k.g{background:linear-gradient(135deg,#2bb069,#137a3a)}.k.p{background:linear-gradient(135deg,#9b6cd6,#6a3fb0)}.k.a{background:linear-gradient(135deg,#e0a43a,#b07415)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(90,60,30,.08);width:100%;text-align:left;color:var(--tx)}
.card.col{display:block}
.av{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--acc2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.mn{flex:1;min-width:0}.mn .a{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}.mn .b{font-size:13.5px;color:var(--mt);margin-top:1px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:8px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-wt{background:var(--wtbg);color:var(--wt)}.p-bad{background:var(--badbg);color:var(--bad)}.p-bl{background:var(--blbg);color:var(--bl)}.p-gr{background:var(--soft);color:var(--mt)}
.bar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hdB),var(--hdC))}
.bar i.ov{background:linear-gradient(90deg,#d9473b,#b22030)}
.brow{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-top:8px;gap:8px}
.brow:first-child{margin-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{display:flex;justify-content:space-around;align-items:center;width:100%;max-width:600px;height:64px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 20px rgba(120,70,40,.18)}
.nav button{font-size:11.5px;color:var(--mt);text-align:center;flex:1;padding:4px 0;position:relative;min-width:0}
.nav svg{display:block;margin:0 auto 2px;width:22px;height:22px}
.nav .on{color:var(--acc);font-weight:600}
.nav .nb{position:absolute;top:0;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:#B22030;color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;text-align:center;font-size:14px;font-weight:600;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--mt)}
.tabs .on{background:linear-gradient(120deg,var(--hdB),var(--hdC));color:#fff;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chips button{font-size:13.5px;font-weight:600;padding:5px 11px;border-radius:16px;border:1.5px solid var(--line);color:var(--mt);background:var(--card)}
.chips .on{background:var(--soft);border-color:var(--acc);color:var(--acc2)}
.gridwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
table.rg{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:100%}
.rg th{color:var(--mt);font-weight:600;font-size:12px;padding:2px;text-align:center;white-space:nowrap}
.rg th.td{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.rg td{vertical-align:top;min-width:58px}
.rg td.nm{font-weight:600;font-size:12.5px;white-space:nowrap;padding:4px 4px 0 2px;min-width:0;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.rg td.nm small{display:block;font-weight:400;color:var(--mt);font-size:11px}
.cell{min-height:34px;border-radius:8px;border:1.5px dashed transparent;display:flex;flex-direction:column;gap:3px;width:100%}
.cell.add:hover,.cell.add:active{border-color:var(--line)}
.sh{border-radius:7px;padding:4px 3px;text-align:center;font-weight:600;line-height:1.15;font-size:11.5px;position:relative;width:100%;display:block}
.sh small{display:block;font-weight:400;font-size:10.5px;opacity:.85}
.s-published{background:var(--okbg);color:var(--ok)}.s-draft{background:var(--wtbg);color:var(--wt)}.s-open{background:var(--badbg);color:var(--bad);border:1.5px dashed var(--bad)}.s-cancelled{background:var(--soft);color:var(--mt);text-decoration:line-through}.s-completed{background:var(--blbg);color:var(--bl)}
.s-leave{color:var(--mt);font-weight:400;font-size:11px;text-align:center;padding:6px 0}
.sh .cf{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:7px;background:#B22030;color:#fff;font-size:10px;line-height:14px}
.sh .sw{position:absolute;top:-4px;left:-4px;width:14px;height:14px;border-radius:7px;background:#1A4596;color:#fff;font-size:9px;line-height:14px}
.sh.sel{outline:3px solid #1A4596;outline-offset:1px}
.warn{background:var(--badbg);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;margin:8px 0}
.warn span,.warn li{display:block;font-weight:400;margin-top:3px}
.warn.soft{background:var(--wtbg);color:var(--wt)}
.info{background:var(--blbg);color:var(--bl);border-radius:12px;padding:9px 12px;font-size:14px;margin:8px 0}
.okmsg{background:var(--okbg);color:var(--ok);border-radius:12px;padding:9px 12px;font-size:14px;margin:8px 0;font-weight:600}
.btn{display:block;width:100%;text-align:center;background:linear-gradient(120deg,var(--hdB),var(--hdC));color:#fff;font-weight:600;font-size:16px;padding:12px;border-radius:14px;margin-top:8px}
.btn.g{background:linear-gradient(120deg,#137a3a,#2bb069)}
.btn.r{background:linear-gradient(120deg,#8f1824,#b22030)}
.btn.w{background:var(--card);color:var(--acc2);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{flex:1 1 0;text-align:center;font-weight:600;font-size:14px;padding:8px 6px;border-radius:10px;min-width:70px}
.b-ok{background:#137A3A;color:#fff}.b-no{border:2px solid var(--line);color:var(--bad)}.b-q{border:2px solid var(--line);color:var(--bl)}.b-n{border:2px solid var(--line);color:var(--acc2)}
.sm{font-size:13px;color:var(--mt)}
.rq .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.next{border-radius:20px;padding:15px;color:#fff;background:linear-gradient(135deg,#1a4596,#3b82f6);box-shadow:0 10px 24px #1a459640;margin-bottom:10px;display:block;width:100%;text-align:left}
.next.none{background:linear-gradient(135deg,#7a6a5a,#a8927a)}
.next.live{background:linear-gradient(135deg,#137a3a,#2bb069)}
.next .k1{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;opacity:.9}
.next .a{font-size:22px;font-weight:600;margin-top:3px}.next .b{font-size:14px;opacity:.92;margin-top:2px}
.next .bt{display:flex;gap:6px;margin-top:10px}.next .bt button{flex:1;text-align:center;background:#ffffff33;border-radius:10px;padding:9px;font-weight:600;font-size:15px;color:#fff}
.day{width:44px;text-align:center;flex:none}.day .d{font-size:12px;color:var(--mt);font-weight:600;text-transform:uppercase}.day .n{font-size:20px;font-weight:600}
.fld{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;display:block}
.fld .l,.fld label{font-size:12.5px;color:var(--mt);font-weight:600;display:block}
.fld input,.fld select,.fld textarea{width:100%;border:0;background:transparent;color:var(--tx);font-family:inherit;font-size:16px;padding:4px 0 2px;min-width:0}
.fld select option{background:var(--card);color:var(--tx)}
.fld textarea{resize:vertical;min-height:64px}
.fld.err{box-shadow:0 0 0 2px var(--bad)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.ermsg{color:var(--bad);font-size:13px;font-weight:600;min-height:0;margin:2px 2px 6px}
.ov{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg1);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px max(14px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px #00000040}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 10px;font-size:20px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.shead h3{margin:0;flex:1}
.x{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:20px;color:var(--mt);flex:none}
.toast{position:fixed;left:50%;transform:translate(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--card);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;z-index:70;max-width:90%;text-align:center;box-shadow:0 6px 20px #0000004d}
.empty{text-align:center;color:var(--mt);padding:18px 10px;font-size:15px;background:var(--card);border:1px dashed var(--line);border-radius:14px;margin-bottom:8px}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(165deg,#faf4ea,#f5ecdd 55%,#f0e4d0);transition:opacity .5s}
.splash img{width:55%;max-width:280px;border-radius:14px;box-shadow:0 10px 30px #3c281440}
.wm{display:flex;align-items:center;gap:10px;font-family:Inter,Calibri,Carlito,sans-serif;font-size:36px;letter-spacing:-1px}
.wm b{color:#B22030;font-weight:700}.wm i{color:#1A4596;font-style:normal;font-weight:400}
.login{position:fixed;inset:0;z-index:40;overflow:auto;display:flex;flex-direction:column;background:linear-gradient(165deg,#faf4ea,#f5ecdd 55%,#f0e4d0);padding:max(28px,env(safe-area-inset-top,0px)) 16px 24px;color:#3A2E25}
.lgbox{max-width:440px;width:100%;margin:0 auto}
.lgfoot{margin-top:auto;padding-top:24px;max-width:440px;width:100%;margin-left:auto;margin-right:auto}.lgfoot .pby{justify-content:flex-start;text-align:left;gap:12px;margin:0}.lgfoot .pby img{width:110px;border-radius:7px}.lgfoot .cpy{text-align:left;margin:8px 0 0}
body:has(.nav .in:empty) .app{padding-bottom:env(safe-area-inset-bottom,0px)}
.lgbox .wm{justify-content:center;margin:10px 0 16px}
.login .fld{background:#FFFBF4;border-color:#E2D3BD}.login .fld input,.login .fld select{color:#3A2E25}.login .fld label{color:#7A6A5A}
.login .btn{background:linear-gradient(120deg,#8a6040,#bc8048)}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#FFFBF4;border:1px solid #E2D3BD;border-radius:12px;padding:9px 12px;margin-bottom:6px;color:#3A2E25}
.pick .mn .b{color:#7A6A5A}
.pby{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 6px;color:var(--mt);font-size:13px}
.pby img{width:64px;border-radius:5px}
.pby b{color:var(--tx)}
.cpy{text-align:center;font-size:12px;color:var(--mt);margin:2px 0 8px}
.vldtop{display:block;width:150px;border-radius:8px;margin:0 0 10px auto}
.xban{border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.xban span{display:block;font-weight:400;margin-top:2px}
.xend{background:#B22030;color:#fff}.xbar{background:var(--wtbg);color:var(--wt)}.xdemo{background:var(--blbg);color:var(--bl)}
.xb{height:7px;border-radius:4px;background:#00000014;margin-top:6px;overflow:hidden}.xb i{display:block;height:100%;background:var(--wt)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}.tg .tl{flex:1;font-size:15px}
.swc{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.swc:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px #0000004d}
.swc.on{background:#137A3A}.swc.on:after{left:25px}
.lang{display:flex;gap:8px}.lang button{flex:1;text-align:center;font-size:15px;padding:9px 0;border-radius:10px;border:2px solid var(--line);font-weight:600;color:var(--mt);background:var(--card)}
.lang .on{border-color:var(--acc);color:var(--acc2);background:var(--soft)}
.bgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bgs button{border-radius:12px;padding:8px 6px 10px;border:2px solid var(--line);font-weight:600;font-size:14px;color:var(--mt);background:var(--card)}
.bgs button i{display:block;height:40px;border-radius:9px;margin-bottom:6px}
.bgs .on{border-color:var(--acc);color:var(--tx)}
.menu .card{font-size:16px;font-weight:600}
.menu svg{width:22px;height:22px;color:var(--acc);flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--mt);font-weight:600;font-size:12.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tblw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 10px;overflow-x:auto;margin-bottom:8px}
.clockbig{width:100%;padding:18px;border-radius:18px;font-size:22px;font-weight:600;color:#fff;background:linear-gradient(120deg,#137a3a,#2bb069);margin-top:8px}
.clockbig.out{background:linear-gradient(120deg,#8f1824,#b22030)}
.clockbig.brk{background:linear-gradient(120deg,#b07415,#e0a43a)}
.now{font-size:40px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.qrbox{background:#fff;border-radius:14px;padding:10px;display:flex;justify-content:center;margin:8px 0}
video.scan{width:100%;border-radius:14px;background:#000;max-height:300px}
.code{font-size:30px;font-weight:600;letter-spacing:6px;text-align:center;color:var(--acc2)}
.hl{display:flex;gap:8px;align-items:center}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--acc);flex:none;position:relative}
.cb.on{background:var(--acc)}.cb.on:after{content:"";position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.avrow{display:grid;grid-template-columns:52px 1fr 1fr 1.2fr 30px;gap:6px;align-items:center;margin-bottom:6px}
.avrow select,.avrow input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--tx);padding:6px 4px;font-family:inherit;font-size:14px}
.unread .a:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#B22030;margin-right:6px;vertical-align:2px}
.link{color:var(--acc);font-weight:600}

.rg tr>*:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.login .btn.w{background:#FFFBF4;color:#7a5232;border:1.5px solid #E2D3BD}
.sh .cf.soft{background:#B07415}

.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(90,60,30,.08);color:var(--tx)}
.big .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.big .ic svg{width:28px;height:28px}
.big .i1{background:linear-gradient(135deg,#c9965f,#9a6a3a)}.big .i2{background:linear-gradient(135deg,#2bb069,#137a3a)}.big .i3{background:linear-gradient(135deg,#3b82f6,#1a4596)}.big .i4{background:linear-gradient(135deg,#9b6cd6,#6a3fb0)}
.big .a{display:block;font-size:20px;font-weight:600}.big .b{display:block;font-size:15px;color:var(--mt);margin-top:2px}
.big .n{margin-left:auto;min-width:34px;height:34px;border-radius:17px;background:#B22030;color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0 9px;flex:none}
.big .go{margin-left:auto;font-size:26px;color:var(--mt);opacity:.5;flex:none}
.note{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--wtbg);color:var(--wt);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;margin:0 0 12px}
.bar2{display:flex;gap:8px;margin-bottom:10px}
.bar2 button{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:15px;font-weight:600;color:var(--acc2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkrow{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;margin:0 2px 10px}
.wkrow button{font-size:26px;color:var(--acc);width:44px;height:36px;line-height:1}
.row2{display:flex;gap:8px;margin-top:10px}.row2 .btn{flex:1;margin-top:0}.row2 .dots{flex:none;width:58px;font-size:20px}
.more{display:block;width:100%;text-align:center;color:var(--acc);font-weight:600;font-size:16px;padding:8px;margin:2px 0 8px}
.keyline{font-size:13px;color:var(--mt);margin:8px 2px 10px;line-height:1.5}
.keyline b{color:var(--tx)}
.tchips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tchips button{border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;font-size:15px;color:var(--tx);background:var(--card);text-align:center}
.tchips button small{display:block;font-size:12px;color:var(--mt);margin-top:1px}
.tchips button.on{border-color:var(--acc);background:var(--soft);font-weight:600}
.sh{font-size:14px;padding:7px 3px}
.rg .s-leave{font-size:11.5px;padding:8px 0;opacity:.75}
.av.code{background:linear-gradient(135deg,#3b82f6,#1a4596);color:#fff;font-size:16px}
button.next{border:0;font-family:inherit}

main.bd{flex:1;position:relative;padding-bottom:124px}
main.bd>.pby{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:32px;margin:0;justify-content:flex-start;text-align:left;gap:12px}
main.bd>.pby img{width:110px;border-radius:7px}
main.bd>.cpy{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:8px;margin:0;text-align:left}
.clogo{flex:0 0 auto;width:96px;height:44px;border-radius:12px;border:2px dashed var(--acc);background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--acc2);font-size:12px;font-weight:600;line-height:1.15;text-align:center;padding:0}
.clogo small{font-size:11px;font-weight:400;color:var(--mt)}
.clogo.has{border:1px solid var(--line);background:#fff;padding:3px 6px}.clogo img{max-width:100%;max-height:100%;object-fit:contain}
.lgprev{width:200px;height:84px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px;margin:4px auto 8px;box-sizing:border-box}
.lgprev img{max-width:100%;max-height:100%;object-fit:contain}
.hact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.nav:has(.in:empty){display:none}
